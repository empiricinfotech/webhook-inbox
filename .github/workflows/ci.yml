name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, lint, types, tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout proposed merge or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node and bundled npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime and package manager
        run: |
          node --input-type=module -e 'import p from "./package.json" with { type: "json" }; if (process.versions.node !== p.engines.node) process.exit(1)'
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
          npm run check:toolchain
      - name: Install frozen dependencies
        run: npm run bootstrap
      - name: Verify dependency tree and imports
        run: npm run check:dependencies
      - name: ESLint
        run: npm run lint
      - name: Strict TypeScript checks
        run: npm run typecheck
      - name: Provision native Mongo for owned disposable fixtures
        run: |
          mongo_dir="$RUNNER_TEMP/webhook-mongo-8.0.32"
          mkdir -p "$mongo_dir"
          archive="$mongo_dir/mongodb.tgz"
          curl --fail --silent --show-error --location --retry 3 \
            https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.32.tgz \
            --output "$archive"
          echo "b411be17c31ef249767ed91974d876e007c91afd5f45e1534057d247eada9f0d  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$mongo_dir" --strip-components=1
          "$mongo_dir/bin/mongod" --version
          echo "MONGOD_BINARY=$mongo_dir/bin/mongod" >> "$GITHUB_ENV"
      - name: Fast unit and API suite
        run: npm test
      - name: Demonstrate contract failure and correction
        run: npm run check:ci-contract-gate
      - name: Foundation configuration and startup
        run: npm run check:foundation
      - name: Mongo lifecycle and outage checks
        run: npm run check:mongo
      - name: Build shared contracts, Express and Next production output
        run: npm run build
      - name: Verify emitted backend without TypeScript stripping
        run: npm run check:compiled-api
      - name: Next development forwarding
        run: npm run check:routing
      - name: Whitespace and tracked-file integrity
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
